# Android build pipeline. Scoped to changes that actually affect the
# Android APK: the Flutter Android shell, the JS bundle, bun's host
# build, libskal.so's link script, and the Android-only ICU/JSC scripts.
#
# Other platforms' CI failures (Desktop link issues, iOS device profiles)
# don't block this lane.

name: android

on:
  pull_request:
    paths:
      - examples/kitchen-sink/flutter-host/android/**
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal-js/**
      - examples/kitchen-sink/src/**
      - examples/kitchen-sink/package.json
      - scripts/link-libskal-flutter.sh
      - patches/skal_entry.zig
      - patches/bun-skal-commit.txt
      - patches/webkit-skal-commit.txt
      - scripts/setup.sh
      - scripts/build-icu-android.sh
      - scripts/build-jsc-android.sh
      - packages/skal_native/include/skal.h
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - examples/kitchen-sink/flutter-host/android/**
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal-js/**
      - examples/kitchen-sink/src/**
      - examples/kitchen-sink/package.json
      - scripts/link-libskal-flutter.sh
      - patches/**
      - scripts/setup.sh
      - scripts/build-icu-android.sh
      - scripts/build-jsc-android.sh
      - packages/skal_native/include/skal.h
      - .github/workflows/android.yml
  workflow_call:
    inputs:
      unpin-flutter:
        description: >-
          Push/PR runs pin Flutter (see the note at the flutter-action step).
          nightly.yml sets this true so it floats on stable — a Flutter
          release that breaks us then surfaces within 24 hours instead of at
          whatever future moment someone bumps the pin. Boolean, not a
          version string: GitHub expressions treat '' as falsy, so a
          `inputs.x || 'pin'` fallback would silently re-pin the canary.
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64 macOS — bun's host build and the Android cross-build both
    # run faster on Apple Silicon, and Homebrew's android-ndk cask
    # works out of the box.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ANDROID_NDK_ROOT: /opt/homebrew/share/android-ndk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
        # PINNED, deliberately. `channel: stable` moved to Flutter 3.47.0
        # and its Dart emits dot-shorthand AST that skal_codegen's
        # analyzer ^7 cannot serialize — CI went red on a Flutter release
        # rather than on a commit. 3.41.9 is what the suite is verified
        # against locally and matches the README's documented minimum.
        # nightly.yml stays on floating stable as the canary, so a future
        # break still surfaces within 24 hours instead of at the next bump.
        # Remove this pin once skal_codegen is migrated off analyzer 7.
          channel: stable
          flutter-version: ${{ inputs.unpin-flutter && '' || '3.41.9' }}
          cache: true
          # SDK cache only. The pub-dependency cache's save key runs
          # hashFiles('**/pubspec.lock') over the whole workspace at
          # post-job time — with the multi-GB vendor/ cache restored it
          # blows the 120s template limit and reds an otherwise-green job.
          pub-cache: false

      # bun's lolhtml dep needs nightly Rust. rustup is preinstalled
      # on macos-15 runners; we just toggle the toolchain.
      - run: rustup install nightly && rustup default nightly

      # bun (used to bundle the kitchen-sink JS app and run scripts/setup.sh).
      - uses: oven-sh/setup-bun@v2

      # bun's build needs LLVM 21 (clang) + ninja. cargo's lolhtml link
      # (both host and android cross) uses bare `-fuse-ld=lld`, resolved
      # via PATH — Homebrew's llvm@21 is keg-only, so expose ld.lld.
      - name: Install LLVM 21 toolchain
        run: |
          brew install llvm@21 lld@21 ninja || true
          test -x "$(brew --prefix llvm@21)/bin/clang"
          # ld.lld ships in the lld@21 formula (newer bottles) or inside the llvm@21 keg (older).
          LLD="$(brew --prefix lld@21 2>/dev/null || true)/bin/ld.lld"
          [[ -x "$LLD" ]] || LLD="$(brew --prefix llvm@21)/bin/ld.lld"
          ln -sf "$LLD" /opt/homebrew/bin/ld.lld
          /opt/homebrew/bin/ld.lld --version

      - name: Install Android NDK
        run: brew install --cask android-ndk

      # Cached: vendored bun+WebKit clones, bun's incremental build
      # cache, ICU + JSC for Android (these are 30-60 min cold).
      - uses: actions/cache@v4
        with:
          # Cache the SOURCES, not the build outputs. vendor/bun/build is
          # ~19 GB uncompressed; including it pushed this cache to 4.68 GiB,
          # and three of these (desktop/android/ios-sim) cannot coexist in
          # GitHub's 10 GB per-repo budget — so they evicted each other,
          # every eviction meant a cold build, and a cold build re-fetches
          # ~758 MB of dependency tarballs from github.com unauthenticated.
          # That is what produced the HTTP 429s. Compilation is still cached
          # by ~/.bun/build-cache, which is content-addressed.
          path: |
            vendor/**
            !vendor/bun/build/**
            ~/.bun/build-cache
            build/icu-android
            build/jsc-android
          key: android-vendor-${{ hashFiles('patches/bun-skal-commit.txt', 'patches/webkit-skal-commit.txt') }}
          # Prefix fallback: a pin bump restores the previous vendor/ and
          # setup.sh reconciles it to the new pin (fetch + checkout) —
          # minutes instead of a from-scratch clone + 60-90 min rebuild.
          restore-keys: |
            android-vendor-

      - name: Bootstrap (clone skal forks + copy skal_entry.zig)
        run: scripts/setup.sh
        env:
          SKAL_BOOTSTRAP_ONLY: "1"

      - name: Build vendored bun for host (release)
        working-directory: vendor/bun
        run: PATH="$HOME/.cargo/bin:$PATH" bun run build:release

      - name: Build ICU + JSC for Android (cached after first run)
        run: |
          [[ -d build/icu-android ]] || scripts/build-icu-android.sh
          [[ -d build/jsc-android ]] || scripts/build-jsc-android.sh

      - name: Cross-compile bun for Android
        working-directory: vendor/bun
        run: |
          PATH="$HOME/.cargo/bin:$PATH" bun scripts/build.ts \
            --profile=android-release \
            --build-dir=$(pwd)/build/android

      - name: Re-link libskal.so for the Flutter Android app
        run: scripts/link-libskal-flutter.sh

      # Workspace deps land at the repo root (bun workspaces); the
      # bytecode pass locks onto the vendored bun via the app's
      # scripts/find-vendored-bun.sh.
      - name: Build skal-app.{js,cjs,cjs.jsc}
        working-directory: examples/kitchen-sink
        run: bun run build

      - name: flutter build apk --release
        working-directory: examples/kitchen-sink/flutter-host
        run: flutter build apk --release --target-platform android-arm64


      # Report what the cache actually holds. The previous attempt at
      # trimming this shipped a broken exclusion and looked identical in
      # the log — 4.68 GiB before and after. Print the number so the next
      # run answers the question instead of us inferring it.
      - name: Cache footprint
        if: always()
        run: |
          echo "vendor total:        $(du -sh vendor 2>/dev/null | cut -f1)"
          echo "  vendor/bun/build:  $(du -sh vendor/bun/build 2>/dev/null | cut -f1)  (EXCLUDED)"
          # BSD du (macOS runners) has no --exclude; subtract in awk instead.
          tot=$(du -sk vendor 2>/dev/null | cut -f1)
          bld=$(du -sk vendor/bun/build 2>/dev/null | cut -f1 || echo 0)
          echo "  cached portion:    $(awk -v a="${tot:-0}" -v b="${bld:-0}" 'BEGIN{printf "%.1f GiB", (a-b)/1048576}')"
          echo "  ~/.bun/build-cache: $(du -sh ~/.bun/build-cache 2>/dev/null | cut -f1)"
      - name: flutter build apk --debug
        working-directory: examples/kitchen-sink/flutter-host
        run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            examples/kitchen-sink/flutter-host/build/app/outputs/flutter-apk/app-release.apk
            examples/kitchen-sink/flutter-host/build/app/outputs/flutter-apk/app-debug.apk
            build/skal-android/libskal.flutter.unstripped.so
