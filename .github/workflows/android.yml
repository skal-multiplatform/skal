# Android build pipeline. Scoped to changes that actually affect the
# Android APK: the Flutter Android shell, the JS bundle, bun's host
# build, libskal.so's link script, and the Android-only ICU/JSC scripts.
#
# Other platforms' CI failures (Desktop link issues, iOS device profiles)
# don't block this lane.

name: android

on:
  pull_request:
    paths:
      - examples/kitchen-sink/flutter-host/android/**
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal-js/**
      - examples/kitchen-sink/src/**
      - examples/kitchen-sink/package.json
      - scripts/link-libskal-flutter.sh
      - patches/skal_entry.zig
      - patches/bun-skal-commit.txt
      - patches/webkit-skal-commit.txt
      - scripts/setup.sh
      - scripts/build-icu-android.sh
      - scripts/build-jsc-android.sh
      - packages/skal_native/include/skal.h
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - examples/kitchen-sink/flutter-host/android/**
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal-js/**
      - examples/kitchen-sink/src/**
      - examples/kitchen-sink/package.json
      - scripts/link-libskal-flutter.sh
      - patches/**
      - scripts/setup.sh
      - scripts/build-icu-android.sh
      - scripts/build-jsc-android.sh
      - packages/skal_native/include/skal.h
      - .github/workflows/android.yml
  workflow_call:
    inputs:
      pin-flutter:
        description: >-
          Opt-IN pin, kept as an escape hatch. Flutter was pinned to dodge an
          analyzer 7 crash on newer Dart; skal_codegen is on analyzer 14 now
          and the pin is gone, so push/PR and nightly both float on stable.
          Set this to pin again if a future Flutter release breaks the build
          and you need CI green while it is sorted out.
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64 macOS — bun's host build and the Android cross-build both
    # run faster on Apple Silicon, and Homebrew's android-ndk cask
    # works out of the box.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ANDROID_NDK_ROOT: /opt/homebrew/share/android-ndk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
        # OPT-IN, and off by default — `channel: stable` is what normally
        # runs. This exists to reproduce a green build against a known Flutter
        # when stable breaks us, which it did once: 3.47.0's Dart emitted
        # dot-shorthand AST that skal_codegen's analyzer ^7 could not serialize,
        # and CI went red on a Flutter release rather than on a commit.
        #
        # That is fixed — skal_codegen is on analyzer ^14 — and the pin moved
        # WITH it. 3.41.9 is now BELOW the floor: analyzer ^14 needs
        # meta >=1.18.3, which Flutter ships only from 3.47, so pinning the old
        # value would have failed to resolve for anyone who set the input. The
        # value here must stay >= the README minimum and skal doctor's
        # FLUTTER_MIN (packages/skal-cli/lib/doctor.js).
        #
        # nightly.yml stays on floating stable as the canary, so a future break
        # still surfaces within 24 hours instead of at the next bump.
          channel: stable
          flutter-version: ${{ inputs.pin-flutter && '3.47.0' || '' }}
          cache: true
          # SDK cache only. The pub-dependency cache's save key runs
          # hashFiles('**/pubspec.lock') over the whole workspace at
          # post-job time — with the multi-GB vendor/ cache restored it
          # blows the 120s template limit and reds an otherwise-green job.
          pub-cache: false

      # bun's lolhtml dep needs nightly Rust. rustup is preinstalled
      # on macos-15 runners; we just toggle the toolchain.
      - run: rustup install nightly && rustup default nightly

      # bun (used to bundle the kitchen-sink JS app and run scripts/setup.sh).
      - uses: oven-sh/setup-bun@v2

      # bun's build needs LLVM 21 (clang) + ninja. cargo's lolhtml link
      # (both host and android cross) uses bare `-fuse-ld=lld`, resolved
      # via PATH — Homebrew's llvm@21 is keg-only, so expose ld.lld.
      - name: Install LLVM 21 toolchain
        run: |
          brew install llvm@21 lld@21 ninja || true
          test -x "$(brew --prefix llvm@21)/bin/clang"
          # ld.lld ships in the lld@21 formula (newer bottles) or inside the llvm@21 keg (older).
          LLD="$(brew --prefix lld@21 2>/dev/null || true)/bin/ld.lld"
          [[ -x "$LLD" ]] || LLD="$(brew --prefix llvm@21)/bin/ld.lld"
          ln -sf "$LLD" /opt/homebrew/bin/ld.lld
          /opt/homebrew/bin/ld.lld --version

      - name: Install Android NDK
        run: brew install --cask android-ndk

      # Cached: vendored bun+WebKit clones, bun's incremental build
      # cache, ICU + JSC for Android (these are 30-60 min cold).
      # ── shared vendor sources — RESTORE ONLY ─────────────────────────
      # Same entry as desktop/ios-sim, but this job never writes it.
      #
      # Android is the one platform that BUILDS from vendor/WebKit:
      # build-jsc-android.sh points CMake at it as the source dir. That
      # leaves gitignored artifacts behind, and the fingerprint caught them —
      # android hashed 03de78e3 over 517858 files where desktop and ios-sim
      # both hashed b86d4251 over 517830. Twenty-eight extra files, all in
      # WebKit; vendor/bun matched on all three.
      #
      # Letting android save would make the shared entry's contents depend on
      # which job finished last, and stale generated headers surviving a pin
      # bump is a bad failure to debug. So the two byte-identical platforms
      # are the only writers and this one is a reader.
      #
      # The cost is honest: a change touching only android's paths finds
      # whatever desktop/ios-sim last wrote, or misses. That is still better
      # than today, where android missed two runs in three.
      #
      # Remove this asymmetry by excluding the 28 files the way
      # vendor/bun/build is excluded — the diagnostic below names them.
      - uses: actions/cache/restore@v4
        with:
          path: |
            vendor/**
            !vendor/bun/build/**
          key: vendor-src-${{ hashFiles('patches/bun-skal-commit.txt', 'patches/webkit-skal-commit.txt') }}
          restore-keys: |
            vendor-src-

      # ── per-platform build cache ─────────────────────────────────────
      # Genuinely platform-specific and small, so it stays split three ways.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/build-cache
            build/icu-android
            build/jsc-android
          key: android-build-${{ hashFiles('patches/bun-skal-commit.txt', 'patches/webkit-skal-commit.txt') }}
          restore-keys: |
            android-build-

      - name: Bootstrap (clone skal forks + copy skal_entry.zig)
        run: scripts/setup.sh
        env:
          SKAL_BOOTSTRAP_ONLY: "1"

      - name: Build vendored bun for host (release)
        working-directory: vendor/bun
        run: PATH="$HOME/.cargo/bin:$PATH" bun run build:release

      - name: Build ICU + JSC for Android (cached after first run)
        run: |
          [[ -d build/icu-android ]] || scripts/build-icu-android.sh
          [[ -d build/jsc-android ]] || scripts/build-jsc-android.sh

      - name: Cross-compile bun for Android
        working-directory: vendor/bun
        run: |
          PATH="$HOME/.cargo/bin:$PATH" bun scripts/build.ts \
            --profile=android-release \
            --build-dir=$(pwd)/build/android

      - name: Re-link libskal.so for the Flutter Android app
        run: scripts/link-libskal-flutter.sh

      # Workspace deps land at the repo root (bun workspaces); the
      # bytecode pass locks onto the vendored bun via the app's
      # scripts/find-vendored-bun.sh.
      - name: Build skal-app.{js,cjs,cjs.jsc}
        working-directory: examples/kitchen-sink
        run: bun run build

      - name: flutter build apk --release
        working-directory: examples/kitchen-sink/flutter-host
        run: flutter build apk --release --target-platform android-arm64


      # Report what the cache actually holds. The previous attempt at
      # trimming this shipped a broken exclusion and looked identical in
      # the log — 4.68 GiB before and after. Print the number so the next
      # run answers the question instead of us inferring it.
      - name: Cache footprint
        if: always()
        run: |
          echo "vendor total:        $(du -sh vendor 2>/dev/null | cut -f1)"
          echo "  vendor/bun/build:  $(du -sh vendor/bun/build 2>/dev/null | cut -f1)  (EXCLUDED)"
          # BSD du (macOS runners) has no --exclude; subtract in awk instead.
          tot=$(du -sk vendor 2>/dev/null | cut -f1)
          bld=$(du -sk vendor/bun/build 2>/dev/null | cut -f1 || echo 0)
          echo "  cached portion:    $(awk -v a="${tot:-0}" -v b="${bld:-0}" 'BEGIN{printf "%.1f GiB", (a-b)/1048576}')"
          echo "  ~/.bun/build-cache: $(du -sh ~/.bun/build-cache 2>/dev/null | cut -f1)"

          # Fingerprint EXACTLY what actions/cache is about to store, so the
          # "these three caches hold the same thing" claim is a measurement
          # rather than an inference from three du totals agreeing.
          #
          # Runs at the END of the job on purpose: the question is not whether
          # the SOURCES match after bootstrap (they are a checkout of one
          # pinned commit, so of course they do) but whether anything the
          # build writes back into vendor/ makes the SAVED trees diverge.
          #
          # .git is excluded. Two clones of one commit produce different
          # packfiles — object order and timestamps differ — so including it
          # would report a mismatch that means nothing. setup.sh reconciles
          # whatever .git it finds via clone_pinned_fork (fetch + checkout),
          # so its bytes are inert here.
          # RIDE-ALONG DIAGNOSTIC for the shared-cache split.
          #
          # Android fingerprints 28 files more than desktop/ios-sim, all in
          # WebKit, because build-jsc-android.sh points CMake at vendor/WebKit
          # as its source dir. They are invisible to `git status` (WebKit's own
          # .gitignore covers them) but actions/cache would ship them, which is
          # why this job is restore-only.
          #
          # Naming them is what lets the exclusion be written, after which
          # android can save the shared entry like everyone else. --ignored
          # is the whole point: without it this prints nothing.
          echo "  --- vendor/WebKit: files the build leaves behind ---"
          git -C vendor/WebKit status --porcelain --ignored 2>/dev/null \
            | head -60 | sed 's/^/    /' || echo "    (git status unavailable)"
          echo "  (count: $(git -C vendor/WebKit status --porcelain --ignored 2>/dev/null | wc -l | tr -d ' '))"
          echo "  build/icu-android:  $(du -sh build/icu-android 2>/dev/null | cut -f1)"
          echo "  build/jsc-android:  $(du -sh build/jsc-android 2>/dev/null | cut -f1)"
          echo "  --- content fingerprint (mirrors the cache's own paths) ---"
          fp() {
            find "$1" -type f -not -path '*/.git/*' -not -path 'vendor/bun/build/*' \
              -print0 2>/dev/null | LC_ALL=C sort -z | xargs -0 shasum -a 256 2>/dev/null \
              | shasum -a 256 | cut -d' ' -f1
          }
          n=$(find vendor -type f -not -path '*/.git/*' -not -path 'vendor/bun/build/*' 2>/dev/null | wc -l | tr -d ' ')
          echo "  files:      $n"
          echo "  vendor:     $(fp vendor)"
          for d in vendor/*/; do
            [ -d "$d" ] || continue
            echo "  $(basename "$d"):  $(fp "$d")"
          done
      - name: flutter build apk --debug
        working-directory: examples/kitchen-sink/flutter-host
        run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            examples/kitchen-sink/flutter-host/build/app/outputs/flutter-apk/app-release.apk
            examples/kitchen-sink/flutter-host/build/app/outputs/flutter-apk/app-debug.apk
            build/skal-android/libskal.flutter.unstripped.so
