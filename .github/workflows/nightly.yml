# Cross-platform regression guard. Builds every shipping target every
# night against the latest main, regardless of which paths changed.
#
# Per-platform path filters in android.yml / desktop.yml / ios-sim.yml
# could let a coupling slip through (e.g. someone changes
# patches/skal_entry.zig thinking it's iOS-only but it actually flows
# into every libskal). The nightly catches that within 24 hours.

name: nightly

on:
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC every day
  workflow_dispatch: {}

jobs:
  # The push/PR workflows pin Flutter (see the note in tests.yml). The
  # nightly deliberately does NOT: it passes '' so flutter-action floats on
  # stable. That is the whole point of a regression guard — CI went red once
  # already on a Flutter release rather than on a commit, and with every
  # workflow pinned that class of break would go unseen until someone
  # bumped. Nightly failing while push/PR stays green means "upstream moved",
  # not "someone broke main".
  tests:
    uses: ./.github/workflows/tests.yml
    
  android:
    uses: ./.github/workflows/android.yml
    
  desktop:
    uses: ./.github/workflows/desktop.yml
    
  ios-sim:
    uses: ./.github/workflows/ios-sim.yml
    
