# Dart unit-test fast lane.
#
# Runs the wire-format snapshot tests, the op-drain behaviour tests, the
# JS-side bridge tests and the codegen suite on every PR that touches
# them. No vendor/bun rebuild, no native toolchain — bun is installed
# from the registry purely to run the JS suite — so it completes in ~2 min
# and gives quick feedback when someone changes a constant in wire.dart
# and forgets to update the matching one in packages/skal-js/src/bridge.js.
#
# Heavier per-platform workflows (android.yml, desktop.yml, ios-sim.yml)
# only run on changes to their respective inputs; this is the cheap
# always-on signal.

name: tests

on:
  pull_request:
    paths:
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/test/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal_flutter/analysis_options.yaml
      - packages/skal_codegen/**
      # The JS half of the wire format, the C ABI entry point, and the
      # public header. Without these the drift check this workflow
      # exists for is one-way: a PR touching only bridge.js or
      # skal_entry.zig got zero signal.
      - packages/skal-js/**
      - patches/**
      - packages/skal_native/include/**
      - .github/workflows/tests.yml
  push:
    branches: [main]
    paths:
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/test/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal_flutter/analysis_options.yaml
      - packages/skal_codegen/**
      # The JS half of the wire format, the C ABI entry point, and the
      # public header. Without these the drift check this workflow
      # exists for is one-way: a PR touching only bridge.js or
      # skal_entry.zig got zero signal.
      - packages/skal-js/**
      - patches/**
      - packages/skal_native/include/**
      - .github/workflows/tests.yml
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: packages/skal_flutter
        run: flutter pub get

      - name: flutter analyze
        working-directory: packages/skal_flutter
        run: flutter analyze --no-fatal-infos lib/ test/

      - name: flutter test
        working-directory: packages/skal_flutter
        run: flutter test

      # The JS half of the bridge. Until 2026-07-27 packages/skal-js had
      # no suite at all, so the encoder, the diff cache and the doorbell
      # ringing rule were only ever exercised end-to-end — and a wrong
      # doorbell is silent in both directions (ring too eagerly and you
      # race a node's CREATE_NODE; ring too rarely and every service call
      # quietly costs a frame again).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No install step existed here, and nothing noticed: the original
      # tests only imported bridge.js, which pulls in nothing. The
      # renderer and runtime tests import solid-js (declared, never
      # installed on the runner) and failed with "Cannot find module
      # 'solid-js/universal'" — a gap that could not reproduce locally,
      # where the workspace root hoists solid-js in from the demo.
      - name: bun install
        run: bun install

      - name: bun test (skal-js)
        working-directory: packages/skal-js
        run: bun test --conditions=browser

      - name: bun test (skal-plugin-geolocator)
        working-directory: packages/skal-plugin-geolocator
        run: bun test

      - name: zig test (native store)
        # Uses bun's vendored zig; skips with a message if the vendor
        # tree has not been fetched on this runner.
        run: ./packages/skal_native/test/run.sh

      - name: dart test (skal_codegen)
        working-directory: packages/skal_codegen
        run: |
          dart pub get
          dart test

      # The integration test is the ONLY thing that compiles generated
      # output. Everything else — snapshots included — compares text,
      # which is exactly how an emitter that produced uncompilable Dart
      # shipped with a green suite. It needs the demo's real deps
      # (package:flutter, package:skal_flutter) because the snapshot
      # fixtures can't resolve them inside a pure-Dart package.
      - name: flutter pub get (demo project)
        working-directory: examples/kitchen-sink/flutter-host
        run: flutter pub get

      - name: dart test (skal_codegen — integration, compiles generated output)
        working-directory: packages/skal_codegen
        env:
          SKAL_INTEGRATION: '1'
        run: dart test test/integration_test.dart
