# Dart unit-test fast lane.
#
# Runs the wire-format snapshot tests, the op-drain behaviour tests, the
# JS-side bridge tests and the codegen suite on every PR that touches
# them. No vendor/bun rebuild, no native toolchain — bun is installed
# from the registry purely to run the JS suite — so it completes in ~2 min
# and gives quick feedback when someone changes a constant in wire.dart
# and forgets to update the matching one in packages/skal-js/src/bridge.js.
#
# Heavier per-platform workflows (android.yml, desktop.yml, ios-sim.yml)
# only run on changes to their respective inputs; this is the cheap
# always-on signal.

name: tests

on:
  pull_request:
    paths:
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/test/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal_flutter/analysis_options.yaml
      - packages/skal_codegen/**
      # The JS half of the wire format, the C ABI entry point, and the
      # public header. Without these the drift check this workflow
      # exists for is one-way: a PR touching only bridge.js or
      # skal_entry.zig got zero signal.
      - packages/skal-js/**
      - patches/**
      - packages/skal_native/include/**
      - .github/workflows/tests.yml
  push:
    branches: [main]
    paths:
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/test/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal_flutter/analysis_options.yaml
      - packages/skal_codegen/**
      # The JS half of the wire format, the C ABI entry point, and the
      # public header. Without these the drift check this workflow
      # exists for is one-way: a PR touching only bridge.js or
      # skal_entry.zig got zero signal.
      - packages/skal-js/**
      - patches/**
      - packages/skal_native/include/**
      - .github/workflows/tests.yml
  workflow_call:
    inputs:
      pin-flutter:
        description: >-
          Opt-IN pin, kept as an escape hatch. Flutter was pinned to dodge an
          analyzer 7 crash on newer Dart; skal_codegen is on analyzer 14 now
          and the pin is gone, so push/PR and nightly both float on stable.
          Set this to pin again if a future Flutter release breaks the build
          and you need CI green while it is sorted out.
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
        # OPT-IN, and off by default — `channel: stable` is what normally
        # runs. This exists to reproduce a green build against a known Flutter
        # when stable breaks us, which it did once: 3.47.0's Dart emitted
        # dot-shorthand AST that skal_codegen's analyzer ^7 could not serialize,
        # and CI went red on a Flutter release rather than on a commit.
        #
        # That is fixed — skal_codegen is on analyzer ^14 — and the pin moved
        # WITH it. 3.41.9 is now BELOW the floor: analyzer ^14 needs
        # meta >=1.18.3, which Flutter ships only from 3.47, so pinning the old
        # value would have failed to resolve for anyone who set the input. The
        # value here must stay >= the README minimum and skal doctor's
        # FLUTTER_MIN (packages/skal-cli/lib/doctor.js).
        #
        # nightly.yml stays on floating stable as the canary, so a future break
        # still surfaces within 24 hours instead of at the next bump.
          channel: stable
          flutter-version: ${{ inputs.pin-flutter && '3.47.0' || '' }}
          cache: true

      - name: flutter pub get
        working-directory: packages/skal_flutter
        run: flutter pub get

      - name: flutter analyze
        working-directory: packages/skal_flutter
        run: flutter analyze --no-fatal-infos lib/ test/

      - name: flutter test
        working-directory: packages/skal_flutter
        run: flutter test

      # The JS half of the bridge. Until 2026-07-27 packages/skal-js had
      # no suite at all, so the encoder, the diff cache and the doorbell
      # ringing rule were only ever exercised end-to-end — and a wrong
      # doorbell is silent in both directions (ring too eagerly and you
      # race a node's CREATE_NODE; ring too rarely and every service call
      # quietly costs a frame again).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No install step existed here, and nothing noticed: the original
      # tests only imported bridge.js, which pulls in nothing. The
      # renderer and runtime tests import solid-js (declared, never
      # installed on the runner) and failed with "Cannot find module
      # 'solid-js/universal'" — a gap that could not reproduce locally,
      # where the workspace root hoists solid-js in from the demo.
      - name: bun install
        run: bun install

      - name: bun test (skal-js)
        working-directory: packages/skal-js
        run: bun test --conditions=browser

      - name: bun test (skal-plugin-geolocator)
        working-directory: packages/skal-plugin-geolocator
        run: bun test

      - name: zig test (native store)
        # Uses bun's vendored zig; skips with a message if the vendor
        # tree has not been fetched on this runner.
        run: ./packages/skal_native/test/run.sh

      - name: dart test (skal_codegen)
        working-directory: packages/skal_codegen
        run: |
          dart pub get
          dart test

      # The integration test is the ONLY thing that compiles generated
      # output. Everything else — snapshots included — compares text,
      # which is exactly how an emitter that produced uncompilable Dart
      # shipped with a green suite. It needs the demo's real deps
      # (package:flutter, package:skal_flutter) because the snapshot
      # fixtures can't resolve them inside a pure-Dart package.
      - name: flutter pub get (demo project)
        working-directory: examples/kitchen-sink/flutter-host
        run: flutter pub get

      # The cache-key scheme has to agree across every workflow, and once
      # did not. Three workflows were collapsed onto one shared `vendor-src`
      # entry; release-libskal kept its own `<platform>-vendor-` keys and was
      # not audited, so its next run wrote 4.84 GiB under the retired scheme
      # and evicted the shared entry — silently restoring the thrash the
      # collapse existed to remove.
      #
      # Skal/CLAUDE.md: "When N config files or symbol lists must agree,
      # assert it." This is that assertion. Nothing else notices — the
      # symptom is a slow build weeks later, not a failure.
      - name: Cache keys agree across workflows
        run: |
          bad=$(grep -rnE '^\s*key:\s*[a-z-]+-vendor-' .github/workflows/ || true)
          if [ -n "$bad" ]; then
            echo "::error::retired per-platform vendor cache key still in use:"
            echo "$bad"
            echo "vendor/** is shared — use vendor-src-<hash>; per-platform"
            echo "state belongs under <platform>-build-<hash>."
            exit 1
          fi
          n=$(grep -rcE '^\s*key:\s*vendor-src-' .github/workflows/ | awk -F: '{s+=$2} END {print s}')
          echo "workflows sharing vendor-src: $n"
          [ "${n:-0}" -ge 5 ] || {
            echo "::error::expected >=5 vendor-src keys (desktop, ios-sim, android, release x2), found ${n:-0}"
            exit 1; }

      # Shape D — Flutter Web under dart2wasm.
      #
      # The web target has three shapes and only two were guarded: Solid to
      # DOM, and the prerendered SSG the site is built from. This one was
      # verified by hand — it compiles, boots, and renders the kitchen-sink
      # tree — and then had nothing stopping it regressing.
      #
      # It belongs in this job rather than a platform workflow because no
      # native library is involved: the JS runs in the browser and Flutter Web
      # renders it, so libskal never enters the build. `flutter pub get` for
      # this project has already run above.
      #
      # The artifact check is the point. `flutter build web --wasm` can exit 0
      # having fallen back to the JS compiler, and a green step that silently
      # stopped testing wasm is the failure this step exists to prevent.
      - name: Flutter Web wasm build (Shape D)
        working-directory: examples/kitchen-sink
        run: |
          bun run build:web-flutter
          f=flutter-host/build/web/main.dart.wasm
          test -f "$f" || { echo "::error::no dart2wasm artifact at $f"; exit 1; }
          echo "main.dart.wasm: $(du -h "$f" | cut -f1)"

      - name: dart test (skal_codegen — integration, compiles generated output)
        working-directory: packages/skal_codegen
        env:
          SKAL_INTEGRATION: '1'
        run: dart test test/integration_test.dart
