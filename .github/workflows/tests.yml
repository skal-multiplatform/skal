# Dart unit-test fast lane.
#
# Runs the wire-format snapshot tests, node-state behaviour tests, and
# the codegen suite on every PR that touches them. Pure Dart — no
# vendor/bun rebuild, no native toolchain — so it completes in ~2 min
# and gives quick feedback when someone changes a constant in wire.dart
# and forgets to update the matching one in packages/skal-js/src/bridge.js.
#
# Heavier per-platform workflows (android.yml, desktop.yml, ios-sim.yml)
# only run on changes to their respective inputs; this is the cheap
# always-on signal.

name: tests

on:
  pull_request:
    paths:
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/test/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal_flutter/analysis_options.yaml
      - packages/skal_codegen/**
      # The JS half of the wire format, the C ABI entry point, and the
      # public header. Without these the drift check this workflow
      # exists for is one-way: a PR touching only bridge.js or
      # skal_entry.zig got zero signal.
      - packages/skal-js/**
      - patches/**
      - packages/skal_native/include/**
      - .github/workflows/tests.yml
  push:
    branches: [main]
    paths:
      - packages/skal_flutter/lib/**
      - packages/skal_flutter/test/**
      - packages/skal_flutter/pubspec.yaml
      - packages/skal_flutter/analysis_options.yaml
      - packages/skal_codegen/**
      # The JS half of the wire format, the C ABI entry point, and the
      # public header. Without these the drift check this workflow
      # exists for is one-way: a PR touching only bridge.js or
      # skal_entry.zig got zero signal.
      - packages/skal-js/**
      - patches/**
      - packages/skal_native/include/**
      - .github/workflows/tests.yml
  workflow_call:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: packages/skal_flutter
        run: flutter pub get

      - name: flutter analyze
        working-directory: packages/skal_flutter
        run: flutter analyze --no-fatal-infos lib/ test/

      - name: flutter test
        working-directory: packages/skal_flutter
        run: flutter test

      - name: dart test (skal_codegen)
        working-directory: packages/skal_codegen
        run: |
          dart pub get
          dart test

      # The integration test is the ONLY thing that compiles generated
      # output. Everything else — snapshots included — compares text,
      # which is exactly how an emitter that produced uncompilable Dart
      # shipped with a green suite. It needs the demo's real deps
      # (package:flutter, package:skal_flutter) because the snapshot
      # fixtures can't resolve them inside a pure-Dart package.
      - name: flutter pub get (demo project)
        working-directory: examples/kitchen-sink/flutter-host
        run: flutter pub get

      - name: dart test (skal_codegen — integration, compiles generated output)
        working-directory: packages/skal_codegen
        env:
          SKAL_INTEGRATION: '1'
        run: dart test test/integration_test.dart
